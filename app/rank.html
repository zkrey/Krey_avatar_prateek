<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="Help pick the best fit — one tap. Then try your own on Krey.">
<meta property="og:image" content="__OG_IMAGE__">
<meta property="og:image:secure_url" content="__OG_IMAGE__">
<meta property="og:image:alt" content="Help a friend pick their look · Krey">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Krey">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="__OG_TITLE__">
<meta name="twitter:image" content="__OG_IMAGE__">
<style>
  :root{--bg:#0f1012;--surface:#17181c;--line:#2a2d34;--text:#eceef2;--muted:#9aa0aa;
        --gold:#d9b25a;--gold-dim:#5a4d2b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;
       padding:16px;max-width:560px;margin:0 auto;text-align:center}
  h1{font-size:1.15rem;margin:.3rem 0}
  .muted{color:var(--muted);font-size:.85rem}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0}
  .opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column}
  .opt img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .opt .ph{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem}
  .opt .lab{margin:.45rem;padding:.6rem;font-size:.92rem;background:var(--gold);color:#1a1400;font-weight:700;border-radius:10px}
  .opt:active{transform:scale(.99)}
  .opt:active .lab{filter:brightness(.94)}
  .or{color:var(--muted);font-size:.82rem;margin:.4rem 0}
  .strip{margin:.6rem 0}
  .striplab{color:var(--muted);font-size:.78rem;margin-bottom:.35rem}
  .thumbs{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap}
  .thumbs img,.thumbs .tph{width:38px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#222}
  .btn{border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:10px;padding:.7rem 1rem;font-size:.95rem;cursor:pointer}
  .btn.primary{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:700;width:100%;padding:.8rem}
  .cta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-top:1.4rem}
  .thumbs img{cursor:zoom-in}
  /* tap-to-zoom lightbox for the fits carousel */
  .zoomov{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:80}
  .zoomov.show{display:flex}
  .zoomov img{max-width:92vw;max-height:80vh;border-radius:12px;border:1px solid var(--line)}
  .zoomov .zc{position:absolute;top:14px;right:16px;color:#fff;background:#0007;border:0;border-radius:999px;width:38px;height:38px;font-size:1.3rem;cursor:pointer}
  .zoomov .zp,.zoomov .zn{position:absolute;top:50%;transform:translateY(-50%);color:#fff;background:#0007;border:0;border-radius:999px;width:44px;height:44px;font-size:1.4rem;cursor:pointer}
  .zoomov .zp{left:10px}.zoomov .zn{right:10px}
  .zoomov .zcount{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:.85rem;opacity:.92}
</style>
</head>
<body>
  <h1 id="hd">Be honest — which is more <i>them</i>? 💛</h1>
  <div class="muted" id="progress"></div>
  <div id="strip" class="strip"></div>
  <div id="stage"></div>

  <div class="cta" id="cta" hidden>
    <div style="font-weight:600;margin-bottom:.3rem">You're one of their people 💛</div>
    <div class="muted">That really helped them. Now let <b>your</b> circle do the same for you — try a few looks, it takes a minute.</div>
    <button class="btn primary" id="tryown" style="margin-top:.8rem">✨ Try it on me</button>
  </div>

  <!-- tap-to-zoom lightbox for the fits carousel -->
  <div id="zoomov" class="zoomov">
    <button class="zc" id="z_close" aria-label="close">×</button>
    <button class="zp" id="z_prev" aria-label="previous">‹</button>
    <button class="zn" id="z_next" aria-label="next">›</button>
    <img id="z_img" alt="">
    <div class="zcount" id="z_count"></div>
  </div>

<script>
const DATA = __DATA__;   // {set_id, owner_hint, ref, name, looks:[{look_id,name,image_url},...]}
const $=id=>document.getElementById(id);
function sid(){ try{ let s=localStorage.getItem("krey_sid"); if(!s){ s=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("krey_sid",s);} return s;}catch(e){return "anon";} }
const REF = DATA.ref || DATA.owner_hint || new URLSearchParams(location.search).get("ref") || "";
try{ if(REF) localStorage.setItem("krey_ref", REF); }catch(e){}
function platformFromReferrer(){
  const r=(document.referrer||"").toLowerCase();
  if(/whatsapp|wa\.me/.test(r)) return "whatsapp";
  if(/instagram/.test(r)) return "instagram";
  if(/facebook|fb\./.test(r)) return "facebook";
  if(/t\.me|telegram/.test(r)) return "telegram";
  if(/snapchat/.test(r)) return "snapchat";
  if(/twitter|x\.com|t\.co/.test(r)) return "twitter";
  if(/linkedin/.test(r)) return "linkedin";
  return r ? "other" : "direct";
}
const PLAT = platformFromReferrer();
// record the referral (tag the platform in source) + an inbound 'rank view' for platform analytics
if(REF){ try{ fetch("/referral",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({referrer_hint:REF,visitor_hint:sid(),source:"rank/"+PLAT})}); }catch(e){} }
try{ fetch("/closet/event",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({garment_id:"rank",event_type:"view",channel:PLAT,session_hint:sid(),referrer_hint:REF||null})}); }catch(e){}

const looks = DATA.looks||[];
if(DATA.name) $("hd").textContent = DATA.name+" trusts your eye 💛 — which is more them?";

// mixed adaptive sampler: the server picks each next pair (concurrency-safe). A voter does at
// most K matchups (K = number of fits), so it stays short even for 5 fits (which have 10 pairs).
const K = looks.length;
const CAP = Math.min(K, K*(K-1)/2);   // never more than total unique pairs
const seen = new Set();
let done = 0;

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// show ALL fits up front so voters know it's pairwise (2 at a time) — tap any to zoom in
if(looks.length>2){
  $("strip").innerHTML = `<div class="striplab">${looks.length} fits — tap any to zoom · you'll compare a few, two at a time:</div>`
    + `<div class="thumbs">` + looks.map((l,i)=>l.image_url?`<img src="${esc(l.image_url)}" data-i="${i}" alt="">`:`<span class="tph"></span>`).join("") + `</div>`;
  $("strip").querySelectorAll(".thumbs img").forEach(im=>im.onclick=()=>openZoom(+im.dataset.i));
}

// ---- tap-to-zoom lightbox: enlarge the fits one at a time ----
let ZI=0;
function zDraw(){
  const l=looks[ZI]||{};
  $("z_img").src=l.image_url||""; $("z_img").alt=esc(l.name||"");
  $("z_count").textContent=(ZI+1)+" / "+looks.length+(l.name?" · "+l.name:"");
  const multi=looks.length>1;
  $("z_prev").style.display=multi?"":"none"; $("z_next").style.display=multi?"":"none";
}
function openZoom(i){ ZI=i; zDraw(); $("zoomov").classList.add("show"); }
function zClose(){ $("zoomov").classList.remove("show"); }
$("z_close").onclick=zClose;
$("z_prev").onclick=()=>{ ZI=(ZI-1+looks.length)%looks.length; zDraw(); };
$("z_next").onclick=()=>{ ZI=(ZI+1)%looks.length; zDraw(); };
$("zoomov").onclick=e=>{ if(e.target.id==="zoomov") zClose(); };   // tap backdrop to close
document.addEventListener("keydown",e=>{ if(!$("zoomov").classList.contains("show")) return;
  if(e.key==="Escape") zClose(); else if(e.key==="ArrowLeft") $("z_prev").click(); else if(e.key==="ArrowRight") $("z_next").click(); });
let _tx=0;
$("zoomov").addEventListener("touchstart",e=>{ _tx=e.touches[0].clientX; },{passive:true});
$("zoomov").addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>40){ (dx<0?$("z_next"):$("z_prev")).click(); } },{passive:true});
function pairKey(a,b){ return [a,b].sort().join("|"); }
function card(l){
  return l.image_url
    ? `<img src="${l.image_url}" alt="${(l.name||'look')}">`
    : `<div class="ph">renders here<br>once try-on is live</div>`;
}
async function nextRound(){
  if(looks.length<2 || done>=CAP){ finish(); return; }
  let d={};
  try{ const r=await fetch(`/rank/${encodeURIComponent(DATA.set_id)}/next?seen=`+encodeURIComponent([...seen].join(","))); d=await r.json(); }
  catch(e){ finish(); return; }
  if(d.done || !d.a || !d.b){ finish(); return; }
  const a=d.a, b=d.b;
  $("progress").textContent = `Matchup ${done+1} of ${CAP}`;
  $("stage").innerHTML =
    `<div class="pair">
       <button class="opt" data-w="${a.look_id}" data-l="${b.look_id}">${card(a)}<div class="lab">✓ Pick this</div></button>
       <button class="opt" data-w="${b.look_id}" data-l="${a.look_id}">${card(b)}<div class="lab">✓ Pick this</div></button>
     </div><div class="or">tap the look that's more them 💛</div>`;
  $("stage").querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    try{ fetch("/rank/vote",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({set_id:DATA.set_id,winner_look_id:btn.dataset.w,loser_look_id:btn.dataset.l,voter_hint:sid(),referrer_hint:REF})}); }catch(e){}
    seen.add(pairKey(a.look_id,b.look_id)); done++; nextRound();
  });
}
function finish(){
  $("stage").innerHTML = `<div class="muted">All done — thanks, that really helps 💛</div>`;
  $("progress").textContent=""; $("cta").hidden=false;
}
$("tryown").onclick=()=>{ location.href="/closet"+(REF?("?ref="+encodeURIComponent(REF)):""); };
nextRound();
</script>
</body>
</html>
