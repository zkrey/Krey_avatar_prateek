<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krey · Closet</title>
<style>
  :root{--bg:#0f1012;--surface:#17181c;--surface-2:#1e2026;--line:#2a2d34;--text:#eceef2;
        --muted:#9aa0aa;--gold:#d9b25a;--gold-dim:#5a4d2b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;
       padding:16px;max-width:760px;margin:0 auto}
  h1{font-size:1.3rem;margin:.2rem 0 .1rem}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:.9rem}
  .src{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.1rem .5rem;display:inline-block}
  .gate{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.6rem 1.2rem;text-align:center;margin-top:1rem}
  .gate h2{font-size:1.05rem;margin:.2rem 0 .4rem}
  .gate .muted{color:var(--muted);font-size:.88rem;margin-bottom:1rem;display:block}
  .btn{border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:10px;padding:.6rem .9rem;font-size:.9rem;cursor:pointer}
  .btn.primary{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:700}
  .me{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;margin-bottom:.7rem}
  .me img{width:40px;height:52px;object-fit:cover;border-radius:8px;background:#222}
  .me .t{flex:1;font-size:.82rem}
  .unlock{background:var(--surface-2);border:1px dashed var(--gold-dim);border-radius:12px;padding:.7rem .9rem;font-size:.84rem;color:var(--text);margin-bottom:.9rem;display:flex;gap:.6rem;align-items:center}
  .unlock .u{flex:1;color:var(--muted)}
  .flabel{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.5rem 0 .1rem}
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;
        padding:.35rem .8rem;font-size:.85rem;cursor:pointer;text-transform:capitalize}
  .chip.on{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin-top:.8rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:#0009;font-size:.8rem}
  .card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--surface-2)}
  .meta{padding:.5rem .6rem}
  .nm{font-size:.9rem;font-weight:600;line-height:1.2}
  .ty{font-size:.72rem;color:var(--muted);text-transform:capitalize;margin-top:.1rem}
  .seg{font-size:.66rem;color:var(--gold);text-transform:capitalize;margin-top:.05rem}
  .actions{display:flex;gap:.4rem;margin:.1rem .6rem .6rem}
  .abtn{border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:8px;padding:.4rem;font-size:.82rem;cursor:pointer;flex:1}
  .abtn.share{color:var(--muted);border-color:var(--line)}
  .empty{color:var(--muted);padding:2rem 0;text-align:center}
</style>
</head>
<body>
  <h1>Your closet ✨</h1>
  <div class="sub" id="sub">Add a photo and we'll show what you can try on. <span id="src" class="src">…</span></div>

  <!-- photo gate: shown until a photo is added -->
  <div class="gate" id="gate">
    <h2>See it on you 👀</h2>
    <span class="muted">Add one photo — we'll figure out which fits work on it. A head-to-knees shot unlocks the most.</span>
    <button class="btn primary" id="addphoto">Add your photo</button>
    <div class="muted" id="gatemsg" style="margin-top:.7rem"></div>
  </div>

  <!-- after photo: your photo + unlock + filters + grid -->
  <div id="shop" hidden>
    <div class="me"><img id="mephoto" alt="you"><div class="t"><b>Your photo</b><div class="ty" id="cov"></div></div>
      <button class="btn" id="changephoto">Change</button></div>
    <div class="unlock" id="unlock" hidden><div class="u" id="unlockmsg"></div><button class="btn" id="unlockbtn">Add full-body</button></div>

    <div class="flabel">Type</div>
    <div class="filters" id="typefilters"></div>
    <div class="flabel">Occasion</div>
    <div class="filters" id="segfilters"><button class="chip on" data-s="">All</button></div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>No garments for this photo yet.</div>
  </div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let T="", S="", RENDER_LIVE=false, ALL=[], ALLOWED=[], PHOTO=null;
const TYPELABEL={upper:"Tops",lower:"Bottoms",overall:"Dresses"};

function sid(){ try{ let s=localStorage.getItem("krey_sid"); if(!s){ s=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("krey_sid",s);} return s;}catch(e){return "anon";} }
const REF=(function(){ const q=new URLSearchParams(location.search).get("ref"); try{ if(q) localStorage.setItem("krey_ref",q); return q||localStorage.getItem("krey_ref")||""; }catch(e){ return q||""; } })();
let ACTIVATED=false;
if(REF){ try{ fetch("/referral",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({referrer_hint:REF,visitor_hint:sid(),source:"closet"})}); }catch(e){} }
function markActivated(){ if(ACTIVATED||!REF) return; ACTIVATED=true; try{ fetch("/referral",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({referrer_hint:REF,visitor_hint:sid(),source:"closet",activated:true})}); }catch(e){} }
function logEvent(g,event_type,channel){ try{ fetch("/closet/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({garment_id:g.garment_id,event_type,segment:g.segment,cloth_type:g.cloth_type,session_hint:sid(),channel:channel||null,referrer_hint:REF||null})}); }catch(e){} }

function pickPhoto(cb){ const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.onchange=()=>{ if(inp.files[0]) cb(inp.files[0]); }; inp.click(); }

async function analyze(file){
  $("gatemsg").textContent="Reading your photo… ✨"; $("addphoto").disabled=true;
  const fd=new FormData(); fd.append("person",file);
  let d={};
  try{ const r=await fetch("/closet/analyze",{method:"POST",body:fd}); d=await r.json(); }
  catch(e){ $("gatemsg").textContent="Couldn't read that — try another photo."; $("addphoto").disabled=false; return; }
  $("addphoto").disabled=false;
  if(!d.allowed || !d.allowed.length){ $("gatemsg").textContent=d.hint||"Couldn't spot you — try a clearer, well-lit photo."; return; }
  PHOTO=file; ALLOWED=d.allowed; markActivated();
  $("mephoto").src=URL.createObjectURL(file);
  $("cov").textContent = d.hint||"";
  // if not everything unlocked, show the unlock nudge
  const locked = ["upper","lower","overall"].filter(t=>!ALLOWED.includes(t));
  if(locked.length){ $("unlock").hidden=false; $("unlockmsg").innerHTML = "Locked: "+locked.map(t=>TYPELABEL[t]).join(" · ")+" — add a full-body photo to unlock."; }
  else { $("unlock").hidden=true; }
  buildTypeChips();
  $("gate").hidden=true; $("shop").hidden=false;
  load();
}
function buildTypeChips(){
  const box=$("typefilters"); box.innerHTML="";
  const mk=(t,label)=>{ const b=document.createElement("button"); b.className="chip"+((T===t)?" on":""); b.dataset.t=t; b.textContent=label; b.onclick=()=>{ T=t; syncChips(); render(); }; box.appendChild(b); };
  mk("","All"); ALLOWED.forEach(t=>mk(t,TYPELABEL[t]||t));
}
function syncChips(){
  document.querySelectorAll("#typefilters .chip").forEach(c=>c.classList.toggle("on",(c.dataset.t||"")===T));
  document.querySelectorAll("#segfilters .chip").forEach(c=>c.classList.toggle("on",(c.dataset.s||"")===S));
}

async function load(){
  const q=[]; if(S)q.push("segment="+encodeURIComponent(S));
  let data={garments:[],segments:[],render_live:false,source:"?"};
  try{ const r=await fetch("/closet/garments"+(q.length?("?"+q.join("&")):"")); data=await r.json(); }catch(e){}
  RENDER_LIVE=!!data.render_live;
  $("src").textContent = data.source==="supabase" ? "live catalog" : "sample set";
  if($("segfilters").querySelectorAll(".chip").length<=1) buildSegChips(data.segments);
  ALL = (data.garments||[]).filter(g=>ALLOWED.includes(g.cloth_type));
  render();
}
function buildSegChips(segs){
  const box=$("segfilters");
  (segs||[]).forEach(s=>{ const b=document.createElement("button"); b.className="chip"; b.dataset.s=s; b.textContent=s; b.onclick=()=>{ S=s; syncChips(); load(); }; box.appendChild(b); });
}
function render(){
  let gs = ALL.filter(g=>(!T||g.cloth_type===T));
  $("empty").hidden = gs.length>0;
  $("grid").innerHTML = gs.map(g=>`
    <div class="card" data-g='${esc(JSON.stringify(g))}'>
      ${g.image_url?`<img src="${esc(g.image_url)}" alt="${esc(g.name)}" loading="lazy">`:`<div class="ph" style="background:${esc(g.color||'#333')}">${esc(g.category||g.cloth_type||'garment')}</div>`}
      <div class="meta"><div class="nm">${esc(g.name||'Garment')}</div><div class="ty">${esc(g.cloth_type||'')}</div>${g.segment?`<div class="seg">${esc(g.segment)}</div>`:``}</div>
      <div class="actions"><button class="abtn try">Try on</button><button class="abtn share">Share</button></div>
    </div>`).join("");
  $("grid").querySelectorAll(".try").forEach(b=>b.onclick=()=>onTry(cardData(b)));
  $("grid").querySelectorAll(".share").forEach(b=>b.onclick=()=>onShare(cardData(b)));
}
function cardData(b){ return JSON.parse(b.closest(".card").dataset.g); }

async function onShare(g){
  logEvent(g,"share",(navigator.share?"native":"whatsapp"));
  const url=location.origin+"/closet"; const text=`Check out this ${g.name} on Krey ✨`;
  try{ if(navigator.share){ await navigator.share({title:"Krey",text,url}); } else { window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url),"_blank"); } }catch(e){}
}
async function onTry(g){
  logEvent(g,"try");
  if(!RENDER_LIVE){ alert("Try-on render isn't switched on yet."); return; }
  if(!PHOTO){ alert("Add your photo first."); return; }
  showRender("loading",g);
  const fd=new FormData(); fd.append("garment_id",g.garment_id); fd.append("owner_hint",sid()); fd.append("person",PHOTO);
  try{ const r=await fetch("/closet/tryon",{method:"POST",body:fd}); const j=await r.json();
    if(j.image_url) showRender("done",g,j); else showRender("error",g,j);
  }catch(e){ showRender("error",g,{}); }
}
function showRender(state,g,j){
  let ov=$("renderov");
  if(!ov){ ov=document.createElement("div"); ov.id="renderov"; ov.style.cssText="position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"; document.body.appendChild(ov); }
  if(state==="loading"){
    ov.innerHTML=`<div style="text-align:center"><div style="font-size:1.1rem;margin-bottom:.6rem">Putting <b>${esc(g.name)}</b> on you… ✨</div><div class="src">first render can take ~2–3 min (GPU warming); after that it's quick</div></div>`;
  } else if(state==="done"){
    const url=location.origin+(j.look_url||"/closet");
    ov.innerHTML=`<div style="text-align:center;max-width:420px;width:100%">
      <img src="${esc(j.image_url)}" style="max-width:100%;max-height:70vh;border-radius:14px;border:1px solid var(--line)">
      <div style="display:flex;gap:.5rem;margin-top:.8rem">
        <button class="btn primary" id="rov_share" style="flex:1">Share this look</button>
        <button class="btn" id="rov_close" style="flex:1">Done</button></div></div>`;
    $("rov_share").onclick=async()=>{ const text=`Check out this ${g.name} on me — Krey ✨`; try{ if(navigator.share){ await navigator.share({title:"Krey",text,url}); } else { window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url),"_blank"); } }catch(e){} };
    $("rov_close").onclick=()=>ov.remove();
  } else {
    ov.innerHTML=`<div style="text-align:center"><div>Render didn't go through — ${esc((j&&j.detail)||"try again in a moment")}.</div><button class="btn" id="rov_close" style="margin-top:.8rem">Close</button></div>`;
    $("rov_close").onclick=()=>ov.remove();
  }
}

$("addphoto").onclick=()=>pickPhoto(analyze);
$("changephoto").onclick=()=>pickPhoto(analyze);
$("unlockbtn").onclick=()=>pickPhoto(analyze);
$("segfilters").querySelector('[data-s=""]').onclick=()=>{ S=""; syncChips(); load(); };
</script>
</body>
</html>
