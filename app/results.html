<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krey · Your results</title>
<style>
  :root{--bg:#0f1012;--surface:#17181c;--line:#2a2d34;--text:#eceef2;--muted:#9aa0aa;
        --gold:#d9b25a;--gold-dim:#5a4d2b;--green:#4bbf73}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
       padding:16px;max-width:520px;margin:0 auto}
  h1{font-size:1.25rem;margin:.2rem 0}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
  .row{display:flex;gap:.8rem;align-items:center;background:var(--surface);border:1px solid var(--line);
       border-radius:14px;padding:.7rem;margin-bottom:.7rem}
  .row.win{border-color:var(--gold)}
  .row img{width:72px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#222}
  .ph{width:72px;aspect-ratio:3/4;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.6rem;text-align:center}
  .bar{height:8px;background:#2a2d34;border-radius:999px;overflow:hidden;margin-top:.4rem}
  .bar > i{display:block;height:100%;background:var(--gold)}
  .pct{font-weight:700}
  .crown{font-size:1.1rem}
  .btn{border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:10px;
       padding:.8rem;font-size:1rem;cursor:pointer;width:100%;margin-top:1rem}
  .btn.primary{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:700}
  .muted{color:var(--muted);font-size:.85rem;text-align:center;margin-top:.6rem}
</style>
</head>
<body>
  <h1 id="hd">Your results</h1>
  <div class="sub" id="sub">Loading votes…</div>
  <div id="list"></div>
  <div id="converge" class="muted" style="margin:.6rem 0"></div>

  <!-- post-rank confidence re-tap: the Δconfidence signal (fires once votes exist) -->
  <div id="confbox" hidden style="background:var(--surface);border:1px solid var(--gold-dim);border-radius:14px;padding:1rem;margin:1rem 0">
    <div style="font-weight:600;margin-bottom:.2rem">Now that your friends have weighed in…</div>
    <div class="muted" style="text-align:left;margin-bottom:.6rem">How confident are you to wear the winning fit?</div>
    <div id="confrow" style="display:flex;gap:.4rem;flex-wrap:wrap"></div>
    <div class="muted" id="confthanks" hidden style="margin-top:.5rem">Logged — thanks 💛</div>
  </div>

  <button class="btn" id="refresh">↻ Refresh votes</button>
  <button class="btn primary" id="again">Make another ballot</button>
  <div class="muted" id="tip"></div>

<script>
const DATA=__DATA__;   // {set_id}
const $=id=>document.getElementById(id);
async function load(){
  let d={looks:[],votes:0};
  try{ const r=await fetch("/results/"+encodeURIComponent(DATA.set_id)+"/data"); d=await r.json(); }catch(e){}
  const looks=d.looks||[];
  const decisive = !!d.decisive;
  if(!d.votes){
    $("sub").textContent = "No votes yet — send the link to friends to see the ranking.";
  } else if(decisive){
    $("sub").textContent = `${d.votes} vote${d.votes>1?"s":""} · a clear favourite emerged 👑`;
  } else {
    $("sub").innerHTML = `${d.votes} vote${d.votes>1?"s":""} · <b>too close to call</b> — pairwise ranking sharpens with more voters, so share it wider.`;
  }
  $("list").innerHTML = looks.map((l,i)=>{
    const pb=Math.round(l.p_best||0);
    const score=Math.round(l.score||0);
    const lead = decisive && i===0;
    return `<div class="row ${lead?'win':''}">
      ${l.image_url?`<img src="${l.image_url}">`:`<div class="ph">no image</div>`}
      <div style="flex:1">
        <div>${lead?'<span class="crown">👑</span> ':''}${l.name||'Fit '+(i+1)} <span class="pct" style="float:right">${d.votes?pb+'%':'—'}</span></div>
        <div class="bar"><i style="width:${d.votes?score:0}%"></i></div>
        <div class="muted" style="text-align:left;margin-top:.3rem">${d.votes?('friends '+pb+'% sure this is your best · '):''}${l.wins||0} win${(l.wins||0)!==1?'s':''} · ${l.games||0} matchup${(l.games||0)!==1?'s':''}</div>
      </div></div>`;
  }).join("") || `<div class="muted">This ballot has no looks.</div>`;
  // self vs crowd convergence
  if(d.tau!=null){
    const agree = d.tau>0.5 ? "matches your gut ✅" : (d.tau<0 ? "flips your gut 🔄" : "partly differs from your gut");
    $("converge").innerHTML = `Your pick vs friends' pick: <b>${d.tau>0?'+':''}${d.tau}</b> agreement — ${agree}`;
  } else { $("converge").textContent=""; }
  if(d.votes && looks.length){
    $("tip").textContent = decisive
      ? "Confident about the winner? Wear it. That's the whole point 💛"
      : "It's close — a few more votes will break the tie.";
    buildConf(looks[0]);   // current leader
  }
}

function sid(){ try{ let s=localStorage.getItem("krey_sid"); if(!s){ s=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("krey_sid",s);} return s;}catch(e){return "anon";} }
let CONF_DONE=false;
function buildConf(winner){
  if(CONF_DONE) return;
  const box=$("confbox"), row=$("confrow"); box.hidden=false; row.innerHTML="";
  [["Still unsure 😐",2],["A bit more 🙂",5],["Yes, I'd wear it 😎",8],["Totally 🔥",10]].forEach(([label,val])=>{
    const b=document.createElement("button"); b.className="btn"; b.style.flex="1"; b.style.minWidth="45%"; b.textContent=label;
    b.onclick=()=>{
      CONF_DONE=true;
      try{ fetch("/results/confidence",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({set_id:DATA.set_id,look_id:winner&&winner.look_id,owner_hint:sid(),phase:"post",value:val})}); }catch(e){}
      row.querySelectorAll("button").forEach(x=>x.disabled=true); $("confthanks").hidden=false;
    };
    row.appendChild(b);
  });
}
$("refresh").onclick=load;
$("again").onclick=()=>location.href="/studio";
load();
</script>
</body>
</html>
